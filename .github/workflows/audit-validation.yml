name: Kompilot audit validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [blink/audit-remediation-kompilot]

permissions:
  contents: read

concurrency:
  group: kompilot-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  KOMPILOT_DEMO_MODE: 'true'
  VITE_KOMPILOT_DEMO_MODE: 'true'

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint:types

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint:js

  automated-tests:
    name: Automated and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test tests/backend/*.test.ts
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
