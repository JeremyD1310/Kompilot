name: Kompilot audit validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [blink/audit-remediation-kompilot]

permissions:
  contents: read

concurrency:
  group: kompilot-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOMPILOT_DEMO_MODE: 'true'
  VITE_KOMPILOT_DEMO_MODE: 'true'
  # Public identifier for the isolated Blink test project. Never fall back to
  # the production tenant when the application boots in CI.
  VITE_BLINK_PROJECT_ID: kompilot-ai-suite-xxifv5sr

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run TypeScript with the documented launch exception
        shell: bash
        run: |
          set +e
          bun run lint:types 2>&1 | tee /tmp/kompilot-tsc.log
          tsc_status=${PIPESTATUS[0]}
          set -e

          if [ "$tsc_status" -eq 0 ]; then
            exit 0
          fi

          error_count=$(grep -c "error TS" /tmp/kompilot-tsc.log || true)
          if [ "$error_count" -eq 1 ] && grep -Fq 'strictNullChecks must be enabled in tsconfig.json' /tmp/kompilot-tsc.log; then
            echo "::warning file=src/App.tsx,line=126::Known post-launch debt: strictNullChecks remains disabled. All other TypeScript diagnostics are blocking."
            exit 0
          fi

          echo "Unexpected TypeScript diagnostics detected."
          exit "$tsc_status"

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint:js

  automated-tests:
    name: Backend and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test tests/backend/*.test.ts tests/unit/*.test.ts

  e2e-tests:
    name: E2E tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright shard
        run: bunx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
