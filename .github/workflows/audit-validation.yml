name: Kompilot audit validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [blink/audit-remediation-kompilot]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KOMPILOT_DEMO_MODE: 'true'
      VITE_KOMPILOT_DEMO_MODE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeScript
        run: bun run lint:types

      - name: ESLint
        run: bun run lint:js

      - name: Install Playwright browser and system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Automated and E2E tests
        run: bun run test:e2e

      - name: Production build
        run: bun run build
